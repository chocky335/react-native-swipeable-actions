name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable-e2e-android:
        description: 'Run Android E2E tests'
        required: false
        type: boolean
        default: false
      enable-e2e-ios:
        description: 'Run iOS E2E tests'
        required: false
        type: boolean
        default: false
      ios-suite:
        description: 'Diagnosis only: run one iOS suite (a partial run never passes the e2e-ios gate)'
        required: false
        type: choice
        default: all
        options: [all, swipeable, two-sided, rtl, swipe-back, performance]
      ios-grep:
        description: 'Diagnosis only: run iOS tests whose title contains this text'
        required: false
        type: string
        default: ''
      ios-video:
        description: 'Record the iOS simulator screen for each shard'
        required: false
        type: boolean
        default: false

# Every job only reads the repository. Artifacts and caches use the runner's own token.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Test release and package guards
        run: node --test scripts/package-artifact.test.mjs scripts/release-readiness.test.mjs scripts/jest-setup.test.mjs scripts/scene-lifecycle-plugin.test.mjs
      - name: Build and validate consumer artifact
        run: node scripts/package-artifact.mjs pack "$RUNNER_TEMP/swipeable-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/swipeable-package/
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome lint
        run: npm run lint

      - name: Biome format check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: TypeScript declaration check of type fixtures
        run: npm run typecheck:fixtures

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install example dependencies
        run: cd example && npm i --ignore-scripts

      - name: Generate example Android project
        run: cd example && npx expo prebuild --platform android --no-install

      - name: Install E2E harness dependencies
        run: cd e2e && npm ci

      - name: Test iOS shard readiness offline
        run: node --test e2e/helpers/ios-shards.test.mjs

      - name: Test E2E command isolation
        run: cd e2e && npm run test:harness

      - name: Run tests
        run: SKIP_E2E=1 ./scripts/test-all.sh

  # The Linux test job skips the Swift tests, so they run here on every push and pull request.
  test-ios:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check pinned iOS toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run Swift unit tests
        working-directory: ios
        run: swift test

  e2e-android:
    if: inputs.enable-e2e-android == true
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Locate the clean consumer
        run: echo "SWIPEABLE_CONSUMER=$RUNNER_TEMP/swipeable-consumer" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/swipeable-package/

      - name: Install and check packed module in a clean consumer
        run: node scripts/package-artifact.mjs consumer "$RUNNER_TEMP"/swipeable-package/*.tgz "$SWIPEABLE_CONSUMER"

      - name: Generate consumer Android project
        run: cd "$SWIPEABLE_CONSUMER" && npx expo prebuild --platform android --no-install

      - name: Upload consumer acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-consumer-android-${{ github.sha }}
          path: ${{ env.SWIPEABLE_CONSUMER }}/consumer-acceptance.json
          if-no-files-found: error

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-consumer-${{ runner.os }}-${{ hashFiles('example/package.json', 'android/build.gradle') }}
          restore-keys: gradle-consumer-${{ runner.os }}-

      - name: Build release APK
        run: |
          cd "$SWIPEABLE_CONSUMER/android"
          NODE_ENV=production ./gradlew assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/example/android/app/build/outputs/apk/release"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/example/android/app/build/outputs/apk/release/"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-default-x86_64-${{ runner.os }}

      - name: Generate AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "AVD snapshot generated"

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e/logs/android-evidence
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat > /tmp/logcat.txt &
            LOGCAT_PID=$!
            cd e2e && npm run test:android
            TEST_EXIT=$?
            kill $LOGCAT_PID 2>/dev/null || true
            exit $TEST_EXIT

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logcat-android
          path: /tmp/logcat.txt

      - name: Upload Android failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-evidence-android
          path: e2e/logs/android-evidence/
          if-no-files-found: warn

  ios-plan:
    if: inputs.enable-e2e-ios == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Install E2E harness dependencies
        run: npm --prefix e2e ci
      - name: Test shard readiness offline
        run: node --test e2e/helpers/ios-shards.test.mjs
      - name: Discover complete iOS inventory
        id: plan
        run: node e2e/helpers/ios-shards.mjs plan ios-plan/manifest.json
      - name: Select the requested iOS suite
        id: select
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          SUITE: ${{ inputs.ios-suite || 'all' }}
        run: |
          SELECTED=$(jq -c --arg s "$SUITE" \
            'if $s == "all" then . else {include: [.include[] | select(.id == $s)]} end' <<< "$MATRIX")
          test "$(jq '.include | length' <<< "$SELECTED")" -gt 0
          echo "matrix=$SELECTED" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-plan/
          if-no-files-found: error

  build-ios:
    if: inputs.enable-e2e-ios == true
    needs: package
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Locate the clean consumer
        run: echo "SWIPEABLE_CONSUMER=$RUNNER_TEMP/swipeable-consumer" >> "$GITHUB_ENV"

      - name: Check pinned iOS toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/swipeable-package/

      - name: Install and check packed module in a clean consumer
        run: node scripts/package-artifact.mjs consumer "$RUNNER_TEMP"/swipeable-package/*.tgz "$SWIPEABLE_CONSUMER"

      - name: Generate consumer iOS project
        run: cd "$SWIPEABLE_CONSUMER" && npx expo prebuild --platform ios --no-install

      - name: Upload consumer acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-consumer-ios-${{ github.sha }}
          path: ${{ env.SWIPEABLE_CONSUMER }}/consumer-acceptance.json
          if-no-files-found: error

      - name: Install CocoaPods
        run: cd "$SWIPEABLE_CONSUMER/ios" && pod install

      - name: Build release app
        run: |
          cd "$SWIPEABLE_CONSUMER/ios"
          xcodebuild \
            -workspace SwipeableDemo.xcworkspace \
            -scheme SwipeableDemo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Package release app and toolchain identity
        run: |
          mkdir -p ios-build-artifact
          printf '%s\n' "${{ github.sha }}" > ios-build-artifact/source-sha.txt
          xcodebuild -version > ios-build-artifact/xcode-version.txt
          uname -m > ios-build-artifact/architecture.txt
          ditto -c -k --sequesterRsrc --keepParent \
            "$SWIPEABLE_CONSUMER/ios/build/Build/Products/Release-iphonesimulator/SwipeableDemo.app" \
            ios-build-artifact/SwipeableDemo.zip

      - name: Upload release app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release-${{ github.sha }}
          path: ios-build-artifact/
          if-no-files-found: error

  e2e-ios-shard:
    name: iOS / ${{ matrix.id }}
    if: inputs.enable-e2e-ios == true
    needs: [build-ios, ios-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ios-plan.outputs.matrix) }}
    runs-on: macos-26
    # Two attempts: the first, and one retry after host trouble (docs/releasing.md).
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The simulator log of one attempt: the app, the touch path and WebDriverAgent.
      IOS_LOG_PREDICATE: >-
        subsystem == "com.swipeabledemo.app" OR process == "SwipeableDemo" OR process == "backboardd" OR process == "SpringBoard" OR process == "WebDriverAgentRunner-Runner" OR process == "testmanagerd" OR eventMessage CONTAINS[c] "WebDriverAgent"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Download expected inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-plan/

      - name: Check inventory against this checkout
        run: node e2e/helpers/ios-shards.mjs verify-plan ios-plan/manifest.json

      - name: Download release app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-release-${{ github.sha }}
          path: ios-build-artifact/

      - name: Check toolchain and unpack release app
        run: |
          test "$(uname -m)" = arm64
          test "$(cat ios-build-artifact/source-sha.txt)" = "${{ github.sha }}"
          test "$(cat ios-build-artifact/architecture.txt)" = "$(uname -m)"
          test "$(cat ios-build-artifact/xcode-version.txt)" = "$(xcodebuild -version)"
          APP_DIR=example/ios/build/Build/Products/Release-iphonesimulator
          mkdir -p "$APP_DIR"
          ditto -x -k ios-build-artifact/SwipeableDemo.zip "$APP_DIR"
          test -d "$APP_DIR/SwipeableDemo.app"

      - name: Detect simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          DEVICE_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['name'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected simulator: $DEVICE_NAME ($UDID)"
          RUNTIME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(r for r, devs in devices.items() if any(d['udid'] == '$UDID' for d in devs)))
          ")
          echo "Simulator runtime: $RUNTIME"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}"

      - name: Build WebDriverAgent
        run: |
          xcodebuild build-for-testing \
            -project e2e/node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent/WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "${{ github.workspace }}/wda-build" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # A shard gets at most one retry, in this step, and only after host trouble in attempt 1
      # (docs/releasing.md). Each attempt keeps its own evidence in e2e/logs/attempt-N.
      - name: Run E2E tests
        id: wdio
        env:
          IOS_DEVICE_NAME: ${{ steps.sim.outputs.device_name }}
          IOS_UDID: ${{ steps.sim.outputs.udid }}
          IOS_APP_PATH: ${{ github.workspace }}/example/ios/build/Build/Products/Release-iphonesimulator/SwipeableDemo.app
          # Run the build-for-testing output through XCTest, not as a standalone app.
          IOS_WDA_DERIVED_DATA_PATH: ${{ github.workspace }}/wda-build
          IOS_GREP: ${{ inputs.ios-grep }}
          IOS_VIDEO: ${{ inputs.ios-video }}
          IOS_SHARD: ${{ matrix.id }}
          IOS_SPEC: ${{ matrix.spec }}
        run: |
          TOP_PID=
          VIDEO_PID=
          stop_samplers() {
            # Wait for top to exit, so that host-load.txt is complete before a reader opens it.
            if [ -n "$TOP_PID" ]; then kill "$TOP_PID" 2>/dev/null && wait "$TOP_PID" || true; fi
            # SIGINT lets simctl finish the movie file.
            if [ -n "$VIDEO_PID" ]; then kill -INT "$VIDEO_PID" 2>/dev/null && wait "$VIDEO_PID" || true; fi
            TOP_PID=
            VIDEO_PID=
          }
          trap stop_samplers EXIT
          GREP_ARGS=()
          if [ -n "$IOS_GREP" ]; then
            # Mocha reads grep as a regular expression. Match the text of the input only.
            GREP_PATTERN=$(node e2e/helpers/test-filter.mjs "$IOS_GREP")
            GREP_ARGS=(--mochaOpts.grep "$GREP_PATTERN")
          fi
          # The simulator can stall in an attempt, and a relaunch can time out under load.
          # Keep the simulator log from the attempt start on, and sample host load for the
          # whole attempt, to explain a lost touch or a slow relaunch. Each evidence time is
          # UTC, because the gate classifies the evidence again on another host. The host
          # class reads only the load and CPU lines of top, so top prints no process list.
          run_attempt() {
            export IOS_ATTEMPT_DIR="$GITHUB_WORKSPACE/e2e/logs/attempt-$1"
            export E2E_ARTIFACT_DIR="$IOS_ATTEMPT_DIR/ios-evidence"
            IOS_TEST_START=$(TZ=UTC date '+%Y-%m-%d %H:%M:%S+0000')
            printf 'IOS_ATTEMPT=%s\nIOS_TEST_START=%s\n' "$1" "$IOS_TEST_START" >> "$GITHUB_ENV"
            mkdir -p "$E2E_ARTIFACT_DIR"
            TZ=UTC top -l 0 -s 5 -n 0 > "$E2E_ARTIFACT_DIR/host-load.txt" 2>&1 &
            TOP_PID=$!
            if [ "$IOS_VIDEO" = true ]; then
              mkdir -p "$RUNNER_TEMP/ios-video"
              xcrun simctl io "$IOS_UDID" recordVideo --codec h264 --force "$RUNNER_TEMP/ios-video/attempt-$1.mp4" &
              VIDEO_PID=$!
            fi
            local status=0
            (cd e2e && npm run test:ios -- --spec "$IOS_SPEC" --maxInstances 1 "${GREP_ARGS[@]}") || status=$?
            stop_samplers
            return "$status"
          }
          if run_attempt 1; then exit 0; fi
          # A filtered run is diagnosis only, and the gate rejects it. It never gets a retry.
          if [ -n "$IOS_GREP" ]; then exit 1; fi
          # The retry check needs the receipt and the simulator log of attempt 1.
          # Maestro runs after this step, so it did not run for attempt 1.
          ATTEMPT_1="$GITHUB_WORKSPACE/e2e/logs/attempt-1"
          IOS_WDIO_OUTCOME=failure IOS_MAESTRO_OUTCOME=skipped \
            node e2e/helpers/ios-shards.mjs receipt "$IOS_SHARD" ios-plan/manifest.json "$ATTEMPT_1"
          xcrun simctl spawn "$IOS_UDID" log show --timezone UTC --start "$IOS_TEST_START" --style compact \
            --predicate "$IOS_LOG_PREDICATE" > "$ATTEMPT_1/ios-evidence/simulator-log.txt" 2>&1 || true
          if ! node e2e/helpers/host-health.mjs retry ios-plan/manifest.json "$IOS_SHARD" "$ATTEMPT_1"; then
            exit 1
          fi
          # A new boot ends the app, WebDriverAgent and the stalled SpringBoard of attempt 1.
          # The new WDIO run then starts a new Appium server and session.
          xcrun simctl shutdown "$IOS_UDID" || true
          xcrun simctl bootstatus "$IOS_UDID" -b
          run_attempt 2

      # The WDIO step stops its samplers. If the runner ends that step without its EXIT trap,
      # for example on a cancel, this step stops them before a later step reads the evidence.
      - name: Stop host samplers
        if: always()
        run: |
          pkill -f '^top -l 0 -s 5 -n 0$' || true
          pkill -INT -f 'simctl io .* recordVideo' || true
          for _ in $(seq 30); do
            pgrep -f '^top -l 0 -s 5 -n 0$|simctl io .* recordVideo' > /dev/null || break
            sleep 1
          done

      - name: Upload simulator video
        if: always() && inputs.ios-video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-video-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ runner.temp }}/ios-video/
          if-no-files-found: warn

      # A fixed release with its SHA-256 (GitHub release asset digest), not the latest installer script.
      - name: Install Maestro
        if: matrix.maestro
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro/maestro/." "$HOME/.maestro/"
          test -x "$HOME/.maestro/bin/maestro"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro seekbar regression test
        id: maestro
        if: matrix.maestro
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro test e2e/maestro/seekbar-regression.yaml

      # These steps record the last attempt. The WDIO step records an attempt before its retry.
      - name: Record shard step outcomes
        if: always()
        env:
          IOS_WDIO_OUTCOME: ${{ steps.wdio.outcome }}
          IOS_MAESTRO_OUTCOME: ${{ steps.maestro.outcome }}
        run: |
          ATTEMPT_DIR="e2e/logs/attempt-${IOS_ATTEMPT:-1}"
          if [ ! -e "$ATTEMPT_DIR/ios-shard-receipt.json" ]; then
            node e2e/helpers/ios-shards.mjs receipt "${{ matrix.id }}" ios-plan/manifest.json "$ATTEMPT_DIR"
          fi

      - name: Capture simulator logs
        if: always()
        run: |
          EVIDENCE="e2e/logs/attempt-${IOS_ATTEMPT:-1}/ios-evidence"
          mkdir -p "$EVIDENCE"
          if [ ! -e "$EVIDENCE/simulator-log.txt" ]; then
            if [ -n "${IOS_TEST_START:-}" ]; then WINDOW=(--start "$IOS_TEST_START"); else WINDOW=(--last 10m); fi
            xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --timezone UTC "${WINDOW[@]}" \
              --style compact --predicate "$IOS_LOG_PREDICATE" > "$EVIDENCE/simulator-log.txt" 2>&1 || true
          fi

      # Classifies the host for triage. Only the WDIO step uses a host class: for its one retry.
      - name: Classify host health
        if: always()
        continue-on-error: true
        run: >-
          node e2e/helpers/host-health.mjs report ios-plan/manifest.json "${{ matrix.id }}"
          "e2e/logs/attempt-${IOS_ATTEMPT:-1}"

      - name: Upload Appium logs and required shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-shard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: e2e/logs/
          if-no-files-found: error

  # Keep the original required-check job name; matrix success alone is insufficient.
  e2e-ios:
    if: always() && inputs.enable-e2e-ios == true
    needs: [ios-plan, build-ios, e2e-ios-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Install E2E harness dependencies
        run: npm --prefix e2e ci
      - name: Download expected inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-plan/
      - name: Download all shard evidence separately
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ios-shard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ios-shards/
          merge-multiple: false
      # Classifies each shard host for triage. The next step alone decides the gate.
      - name: Summarize host health per shard
        if: always()
        continue-on-error: true
        run: node e2e/helpers/host-health.mjs summary ios-plan/manifest.json ios-shards
      - name: Require complete successful same-run evidence
        env:
          IOS_PLAN_RESULT: ${{ needs.ios-plan.result }}
          IOS_BUILD_RESULT: ${{ needs.build-ios.result }}
          IOS_SHARDS_RESULT: ${{ needs.e2e-ios-shard.result }}
        run: node e2e/helpers/ios-shards.mjs aggregate ios-plan/manifest.json ios-shards
