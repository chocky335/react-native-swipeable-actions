name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify only, or publish an already prepared and tested release'
        required: true
        default: verify
        type: choice
        options: [verify, publish]
      source_sha:
        description: 'Full prepared source SHA; must be the main revision running this workflow'
        required: true
        type: string
      version:
        description: 'Exact committed version: 1.0.0-rc.N or 1.0.0 (never a bump type)'
        required: true
        type: string
      ci_runs:
        description: 'One successful full CI run ID for this exact SHA'
        required: true
        type: string
      acceptance_comment:
        description: 'GitHub issue comment ID containing maintainer physical acceptance JSON'
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: write
      actions: read
      issues: read
      id-token: write
    env:
      RELEASE_SOURCE: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_RUNS: ${{ inputs.ci_runs }}
      RELEASE_ACCEPTANCE: ${{ inputs.acceptance_comment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Recheck remote main after environment approval
        run: |
          set -euo pipefail
          REMOTE_MAIN=$(git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin refs/heads/main)
          test "$REMOTE_MAIN" = "$(printf '%s\trefs/heads/main' "$RELEASE_SOURCE")"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install inventory parser without lifecycle scripts
        run: npm --prefix e2e ci --ignore-scripts

      - name: Test readiness gate offline
        run: node --test scripts/release-readiness.test.mjs

      - name: Verify source, actual mobile evidence, package and physical acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-readiness.mjs
          --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION"
          --runs "$RELEASE_RUNS" --acceptance "$RELEASE_ACCEPTANCE"
          --out "$RUNNER_TEMP/verified-release"

      - name: Preserve verified release report and tested tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-release/
          if-no-files-found: error

      - name: Require an unpublished npm version
        if: inputs.operation == 'publish'
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://registry.npmjs.org/react-native-swipeable-actions/' + process.env.RELEASE_VERSION)
          if (response.status !== 404) throw new Error('Version exists or registry check failed; inspect npm before recovery')
          NODE

      - name: Establish immutable source tag before publishing
        if: inputs.operation == 'publish'
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          REMOTE_TAG=$(git -C "$GITHUB_WORKSPACE" ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$REMOTE_TAG" ]; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "refs/tags/$TAG"
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SOURCE"
          else
            REMOTE_MAIN=$(git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin refs/heads/main)
            test "$REMOTE_MAIN" = "$(printf '%s\trefs/heads/main' "$RELEASE_SOURCE")"
            git -C "$GITHUB_WORKSPACE" tag "$TAG" "$RELEASE_SOURCE"
            REMOTE_MAIN=$(git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin refs/heads/main)
            test "$REMOTE_MAIN" = "$(printf '%s\trefs/heads/main' "$RELEASE_SOURCE")"
            git -C "$GITHUB_WORKSPACE" push origin "refs/tags/$TAG"
          fi

      - name: Publish exactly the tested tarball
        if: inputs.operation == 'publish'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified-release"
          DIST_TAG=latest
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then DIST_TAG=next; fi
          REMOTE_MAIN=$(git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --heads origin refs/heads/main)
          test "$REMOTE_MAIN" = "$(printf '%s\trefs/heads/main' "$RELEASE_SOURCE")"
          npm publish ./package.tgz --tag "$DIST_TAG" --ignore-scripts --provenance
